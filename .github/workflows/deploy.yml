name: Deploy Astro Remote Execution

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'Dockerfile'
      - 'Dockerfile.client'
      - 'requirements.txt'
      - 'requirements-client.txt'
      - 'packages.txt'
      - 'packages-client.txt'
      - 'values.yaml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-push-client:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Astronomer registry login
        run: docker login images.astronomer.cloud -u cli -p ${{ secrets.ASTRO_API_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push client image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.client \
            -t ${{ vars.ACR_NAME }}.azurecr.io/astro-agent:${{ steps.tag.outputs.tag }} \
            --push .

      - name: Verify providers are present
        run: |
          docker run --rm --entrypoint sh \
            ${{ vars.ACR_NAME }}.azurecr.io/astro-agent:${{ steps.tag.outputs.tag }} \
            -c "pip list | grep -iE 'microsoft|common-io|adlfs'"

  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Astro
        uses: astronomer/deploy-action@v0.16.0
        with:
          deployment-id: cmucn0ycj8rok01o01utsobqi
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

  deploy-agent:
    needs: build-push-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Astronomer chart repo
        run: |
          helm repo add astronomer https://helm.astronomer.io
          helm repo update

      - name: Helm upgrade
        run: |
          helm upgrade astro-agent astronomer/astro-remote-execution-agent \
            --version 2.4.0 \
            -f values.yaml \
            --set image=${{ vars.ACR_NAME }}.azurecr.io/astro-agent:${{ needs.build-push-client.outputs.image_tag }} \
            -n ${{ vars.K8S_NAMESPACE }}

      - name: Restart to pick up commonEnv/config changes
        run: kubectl rollout restart deployment -n ${{ vars.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          for d in astro-agent-worker-default-worker astro-agent-dag-processor astro-agent-triggerer astro-agent-sentinel; do
            kubectl rollout status deployment/$d -n ${{ vars.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Confirm Sentinel heartbeat
        run: |
          sleep 45
          kubectl logs -n ${{ vars.K8S_NAMESPACE }} deployment/astro-agent-sentinel --tail=50 \
            | grep "Heartbeat sent successfully" \
            || (echo "::error::No successful heartbeat found after deploy" && exit 1)