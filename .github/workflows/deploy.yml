name: Deploy Astro Remote Execution

on:
  push:
    branches: [main]
    # dags/** is intentionally excluded: GitDagBundle serves DAGs straight from Git.
    paths:
      - 'Dockerfile'
      - 'Dockerfile.client'
      - 'requirements.txt'
      - 'requirements-client.txt'
      - 'packages.txt'
      - 'packages-client.txt'
      - 'values.yaml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-push-client:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Install Astro CLI
        run: curl -sSL install.astronomer.io | sudo bash -s

      - name: Build and push agent image
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        run: astro remote deploy --platform linux/amd64

      - name: Get pushed image tag
        id: get-tag
        run: |
          TAG=$(az acr repository show-tags \
            --name ${{ vars.ACR_NAME }} \
            --repository astro-agent \
            --orderby time_desc --top 1 -o tsv)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astronomer/deploy-action@v0.16.0
        with:
          deployment-id: cmucn0ycj8rok01o01utsobqi
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

  deploy-agent:
    needs: build-push-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm repo add astronomer https://helm.astronomer.io
          helm repo update
          helm upgrade astro-agent astronomer/astro-remote-execution-agent \
            --version 2.4.0 \
            -f values.yaml \
            --set image=${{ vars.ACR_NAME }}.azurecr.io/astro-agent:${{ needs.build-push-client.outputs.image_tag }} \
            -n ${{ vars.K8S_NAMESPACE }}

      - name: Restart and wait for rollout
        run: |
          kubectl rollout restart deployment -n ${{ vars.K8S_NAMESPACE }}
          for d in $(kubectl get deployment -n ${{ vars.K8S_NAMESPACE }} -o name); do
            kubectl rollout status $d -n ${{ vars.K8S_NAMESPACE }} --timeout=900s
          done